 <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  text-align: center;
  padding: 20px;
  overflow: hidden;
  position: relative;
}

/* ⭐ Star layer */
body::before {
  content: "";
  position: absolute;
  width: 200%;
  height: 200%;
  background-image:
    radial-gradient(2px 2px at 20px 30px, white, transparent),
    radial-gradient(2px 2px at 120px 80px, white, transparent),
    radial-gradient(1.5px 1.5px at 200px 150px, white, transparent),
    radial-gradient(1.5px 1.5px at 300px 220px, white, transparent),
    radial-gradient(2px 2px at 400px 120px, white, transparent);
  background-repeat: repeat;
  background-size: 500px 500px;
  opacity: 0.25;
  animation: twinkle 20s linear infinite;
  z-index: 0;
}

@keyframes twinkle {
  from { transform: translateY(0); }
  to { transform: translateY(-500px); }
}

/* 🔮 Constellation overlay */
.constellation {
  position: absolute;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* ✨ Stars glow */
.constellation circle {
  opacity: 0.8;
  animation: starPulse 3.5s ease-in-out infinite alternate;
}

/* ✨ Lines glow */
.constellation line {
  stroke-linecap: round;
  opacity: 0.5;
  animation: lineGlow 5s ease-in-out infinite alternate;
}

@keyframes starPulse {
  from {
    opacity: 0.5;
    transform: scale(1);
  }
  to {
    opacity: 1;
    transform: scale(1.4);
  }
}

@keyframes lineGlow {
  from {
    opacity: 0.3;
  }
  to {
    opacity: 0.8;
  }
}
.card {
  position: relative;
  background: rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(18px);
  border-radius: 20px;
  padding: 40px 30px;
  max-width: 650px;
  width: 100%;
  box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  z-index: 2;
}

.app-icon {
  width: 110px;

  margin-bottom: 20px;
}

h1 {
  font-size: 32px;
  margin-bottom: 10px;
}

p {

}

.lang-toggle {

.lang-toggle:hover {

.footer {

.footer a {

.social {

.social a {

  color: white;

}

.social a:hover {

/* ... Download) ... */

}

.btn-download:hover {

.btn-download i {

.btn-text {

.btn-text span {

.btn-text b {

}
@media (max-width: 450px) {
      .btn-dl {
        width: 100%; /* Kembali ke lebar penuh jika layar terlalu sempit */

</style>

<svg class="constellation" viewBox="0 0 800 600" preserveAspectRatio="none">

<defs>
